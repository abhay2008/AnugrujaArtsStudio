<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    :root { color-scheme: light dark; }
    .icon-dark-tab { display: block; }
    .icon-light-tab { display: none; }
    @media (prefers-color-scheme: light) {
      .icon-dark-tab { display: none; }
      .icon-light-tab { display: block; }
    }
  </style>
  <image class="icon-dark-tab" href="data:image/png;base64," width="64" height="64" />
  <image class="icon-light-tab" href="data:image/png;base64," width="64" height="64" />
</svg>